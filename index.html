<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Metrik Racer</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: 'Courier New', monospace; }
    canvas { display: block; }

    /* HUD */
    #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        color: #00FFAA;
        text-shadow: 0 0 10px #00FFAA;
        z-index: 10;
    }

    #speedo {
        position: absolute;
        bottom: 30px;
        right: 30px;
        text-align: right;
    }

    #speedo .value {
        font-size: 72px;
        font-weight: bold;
        line-height: 1;
        color: #00E5FF;
        text-shadow: 0 0 20px #00E5FF;
    }

    #speedo .unit {
        font-size: 14px;
        color: #00FFAA;
        letter-spacing: 4px;
    }

    #topLeft {
        position: absolute;
        top: 30px;
        left: 30px;
        font-size: 14px;
        line-height: 1.8;
    }

    #topLeft .label {
        color: #FF00AA;
        text-shadow: 0 0 10px #FF00AA;
        letter-spacing: 3px;
        font-size: 11px;
    }

    #topLeft .big {
        font-size: 32px;
        color: #00E5FF;
        text-shadow: 0 0 20px #00E5FF;
        font-weight: bold;
    }

    #controls {
        position: absolute;
        bottom: 30px;
        left: 30px;
        font-size: 11px;
        color: #00FFAA;
        opacity: 0.7;
        line-height: 1.6;
    }

    #controls b {
        color: #FF00AA;
        text-shadow: 0 0 10px #FF00AA;
    }

    #startScreen {
        position: fixed;
        inset: 0;
        background: linear-gradient(180deg, #1a0033 0%, #000 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 100;
        color: #00E5FF;
        text-shadow: 0 0 30px #00E5FF;
        cursor: pointer;
    }

    #startScreen h1 {
        font-size: 64px;
        letter-spacing: 8px;
        margin-bottom: 20px;
    }

    #startScreen h1 span {
        color: #FF00AA;
        text-shadow: 0 0 30px #FF00AA;
    }

    #startScreen p {
        font-size: 16px;
        letter-spacing: 4px;
        margin-top: 40px;
        animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
    }

    #startScreen .hint {
        font-size: 12px;
        color: #00FFAA;
        text-shadow: 0 0 10px #00FFAA;
        margin-top: 60px;
        letter-spacing: 2px;
        line-height: 2;
    }
</style>
</head>
<body>

<div id="startScreen">
    <h1>METRIK <span>RACER</span></h1>
    <p>▶ НАЖМИ ПРОБЕЛ ЧТОБЫ НАЧАТЬ</p>
    <div class="hint">
        WASD — движение &nbsp;·&nbsp; SPACE — ручник &nbsp;·&nbsp; C — камера &nbsp;·&nbsp; R — рестарт
    </div>
</div>

<div id="hud">
    <div id="topLeft">
        <div class="label">TIME</div>
        <div class="big" id="timer">00.00</div>
        <div class="label" style="margin-top:10px">BEST</div>
        <div id="best">--.--</div>
        <div class="label" style="margin-top:10px">LAP</div>
        <div id="lap">0</div>
    </div>

    <div id="speedo">
        <div class="value" id="speed">0</div>
        <div class="unit">KM/H</div>
    </div>

    <div id="controls">
        <b>W/↑</b> газ &nbsp; <b>S/↓</b> тормоз &nbsp; <b>A/D</b> руль<br>
        <b>SPACE</b> ручник &nbsp; <b>C</b> камера &nbsp; <b>R</b> рестарт
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ============================================================
// METRIK RACER — HTML5 3D racing в одном файле
// ============================================================

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0014);
scene.fog = new THREE.Fog(0x0a0014, 80, 300);

const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// ============================================================
// СВЕТ
// ============================================================
const ambient = new THREE.AmbientLight(0x4422aa, 0.6);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xff00aa, 1.2);
sun.position.set(50, 100, 50);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -150;
sun.shadow.camera.right = 150;
sun.shadow.camera.top = 150;
sun.shadow.camera.bottom = -150;
scene.add(sun);

const cyanLight = new THREE.PointLight(0x00E5FF, 1, 100);
cyanLight.position.set(0, 10, 0);
scene.add(cyanLight);

// ============================================================
// ЗЕМЛЯ + СЕТКА (neon)
// ============================================================
const groundGeo = new THREE.PlaneGeometry(1000, 1000);
const groundMat = new THREE.MeshStandardMaterial({
    color: 0x110022,
    roughness: 0.9,
    metalness: 0.1
});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Неоновая сетка
const grid = new THREE.GridHelper(1000, 100, 0x00E5FF, 0xFF00AA);
grid.material.opacity = 0.3;
grid.material.transparent = true;
grid.position.y = 0.01;
scene.add(grid);

// ============================================================
// ТРАССА (кольцо)
// ============================================================
const TRACK_RADIUS = 80;
const TRACK_WIDTH = 20;
const trackPoints = [];
const NUM_POINTS = 64;

for (let i = 0; i < NUM_POINTS; i++) {
    const a = (i / NUM_POINTS) * Math.PI * 2;
    const r = TRACK_RADIUS + Math.sin(a * 3) * 15; // извилистая
    trackPoints.push(new THREE.Vector3(Math.cos(a) * r, 0, Math.sin(a) * r));
}

// Асфальт — серия сегментов
const trackMat = new THREE.MeshStandardMaterial({
    color: 0x1a1a2e,
    roughness: 0.7,
    metalness: 0.3
});

for (let i = 0; i < trackPoints.length; i++) {
    const p1 = trackPoints[i];
    const p2 = trackPoints[(i + 1) % trackPoints.length];
    const mid = p1.clone().add(p2).multiplyScalar(0.5);
    const dir = p2.clone().sub(p1);
    const len = dir.length();

    const segGeo = new THREE.PlaneGeometry(TRACK_WIDTH, len + 1);
    const seg = new THREE.Mesh(segGeo, trackMat);
    seg.rotation.x = -Math.PI / 2;
    seg.rotation.z = -Math.atan2(dir.z, dir.x) + Math.PI / 2;
    seg.position.set(mid.x, 0.02, mid.z);
    seg.receiveShadow = true;
    scene.add(seg);
}

// Бордюры (красно-белые)
for (let i = 0; i < trackPoints.length; i++) {
    const p1 = trackPoints[i];
    const p2 = trackPoints[(i + 1) % trackPoints.length];
    const mid = p1.clone().add(p2).multiplyScalar(0.5);
    const dir = p2.clone().sub(p1).normalize();
    const perp = new THREE.Vector3(-dir.z, 0, dir.x);

    // Левая сторона
    const leftPos = mid.clone().add(perp.clone().multiplyScalar(-TRACK_WIDTH / 2 - 1));
    const rightPos = mid.clone().add(perp.clone().multiplyScalar(TRACK_WIDTH / 2 + 1));

    const isEven = i % 2 === 0;
    const curbColor = isEven ? 0xFF00AA : 0xFFFFFF;

    [leftPos, rightPos].forEach(pos => {
        const curbGeo = new THREE.BoxGeometry(2, 1, 4);
        const curbMat = new THREE.MeshStandardMaterial({
            color: curbColor,
            emissive: curbColor,
            emissiveIntensity: 0.4
        });
        const curb = new THREE.Mesh(curbGeo, curbMat);
        curb.position.set(pos.x, 0.5, pos.z);
        curb.rotation.y = -Math.atan2(dir.z, dir.x);
        curb.castShadow = true;
        scene.add(curb);
    });
}

// ============================================================
// ПАЛЬМЫ / ДЕРЕВЬЯ (силуэты)
// ============================================================
for (let i = 0; i < 40; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = TRACK_RADIUS + 40 + Math.random() * 60;
    const x = Math.cos(a) * r;
    const z = Math.sin(a) * r;

    const trunkGeo = new THREE.CylinderGeometry(0.5, 0.7, 8, 6);
    const trunkMat = new THREE.MeshStandardMaterial({ color: 0x2a0033 });
    const trunk = new THREE.Mesh(trunkGeo, trunkMat);
    trunk.position.set(x, 4, z);
    trunk.castShadow = true;
    scene.add(trunk);

    const leavesGeo = new THREE.ConeGeometry(3, 6, 8);
    const leavesMat = new THREE.MeshStandardMaterial({
        color: 0xFF00AA,
        emissive: 0xFF00AA,
        emissiveIntensity: 0.3
    });
    const leaves = new THREE.Mesh(leavesGeo, leavesMat);
    leaves.position.set(x, 10, z);
    leaves.castShadow = true;
    scene.add(leaves);
}

// ============================================================
// МАШИНА
// ============================================================
const car = new THREE.Group();

// Кузов
const bodyGeo = new THREE.BoxGeometry(2, 0.8, 4);
const bodyMat = new THREE.MeshStandardMaterial({
    color: 0x0a0a0a,
    metalness: 0.9,
    roughness: 0.2,
    emissive: 0x00E5FF,
    emissiveIntensity: 0.15
});
const body = new THREE.Mesh(bodyGeo, bodyMat);
body.position.y = 0.6;
body.castShadow = true;
car.add(body);

// Кабина
const cabinGeo = new THREE.BoxGeometry(1.6, 0.6, 1.8);
const cabinMat = new THREE.MeshStandardMaterial({
    color: 0x000814,
    metalness: 1,
    roughness: 0.1
});
const cabin = new THREE.Mesh(cabinGeo, cabinMat);
cabin.position.set(0, 1.1, -0.2);
cabin.castShadow = true;
car.add(cabin);

// Неоновая подсветка снизу
const underGlowGeo = new THREE.PlaneGeometry(2.5, 4.5);
const underGlowMat = new THREE.MeshBasicMaterial({
    color: 0x00E5FF,
    transparent: true,
    opacity: 0.6,
    side: THREE.DoubleSide
});
const underGlow = new THREE.Mesh(underGlowGeo, underGlowMat);
underGlow.rotation.x = -Math.PI / 2;
underGlow.position.y = 0.05;
car.add(underGlow);

// Фары
const headlightMat = new THREE.MeshBasicMaterial({ color: 0xFFAA00 });
const headlightGeo = new THREE.BoxGeometry(0.4, 0.2, 0.1);

const hl1 = new THREE.Mesh(headlightGeo, headlightMat);
hl1.position.set(-0.6, 0.6, -2);
car.add(hl1);
const hl2 = new THREE.Mesh(headlightGeo, headlightMat);
hl2.position.set(0.6, 0.6, -2);
car.add(hl2);

// Задние фонари
const taillightMat = new THREE.MeshBasicMaterial({ color: 0xFF0055 });
const tl1 = new THREE.Mesh(headlightGeo, taillightMat);
tl1.position.set(-0.6, 0.6, 2);
car.add(tl1);
const tl2 = new THREE.Mesh(headlightGeo, taillightMat);
tl2.position.set(0.6, 0.6, 2);
car.add(tl2);

// Колёса
const wheelGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.4, 16);
const wheelMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.9 });
const wheels = [];

[[-1, -1.2], [1, -1.2], [-1, 1.2], [1, 1.2]].forEach(([x, z]) => {
    const w = new THREE.Mesh(wheelGeo, wheelMat);
    w.rotation.z = Math.PI / 2;
    w.position.set(x, 0.5, z);
    w.castShadow = true;
    car.add(w);
    wheels.push(w);
});

scene.add(car);

// ============================================================
// ФИЗИКА
// ============================================================
const state = {
    x: 0, z: -TRACK_RADIUS,
    angle: 0,
    speed: 0,
    maxSpeed: 80,
    accel: 40,
    friction: 0.98,
    brakeForce: 80,
    turnSpeed: 2.5,
    drift: 0,
    running: false,
    lap: 0,
    lapStart: 0,
    bestLap: null,
    lastCheckpoint: 0
};

const keys = {};
addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'KeyR') resetCar();
    if (e.code === 'KeyC') switchCamera();
    if (e.code === 'Space') e.preventDefault();
});
addEventListener('keyup', e => keys[e.code] = false);

// Управление камерой
let cameraMode = 0; // 0 - сзади, 1 - капот, 2 - сверху
function switchCamera() {
    cameraMode = (cameraMode + 1) % 3;
}

// Старт
const startScreen = document.getElementById('startScreen');
addEventListener('keydown', e => {
    if (e.code === 'Space' && !state.running) {
        startScreen.style.display = 'none';
        state.running = true;
        state.lapStart = performance.now();
    }
});
startScreen.addEventListener('click', () => {
    startScreen.style.display = 'none';
    state.running = true;
    state.lapStart = performance.now();
});

// ============================================================
// КОЛЛИЗИИ (не вылетать с трассы)
// ============================================================
function distToTrack(x, z) {
    let minDist = Infinity;
    for (let i = 0; i < trackPoints.length; i++) {
        const p = trackPoints[i];
        const d = Math.hypot(x - p.x, z - p.z);
        if (d < minDist) minDist = d;
    }
    return minDist;
}

// ============================================================
// ИГРОВОЙ ЦИКЛ
// ============================================================
const timerEl = document.getElementById('timer');
const bestEl = document.getElementById('best');
const lapEl = document.getElementById('lap');
const speedEl = document.getElementById('speed');

function resetCar() {
    state.x = 0;
    state.z = -TRACK_RADIUS;
    state.angle = 0;
    state.speed = 0;
    state.lap = 0;
    state.lapStart = performance.now();
    state.lastCheckpoint = 0;
}

function update(dt) {
    if (!state.running) return;

    const throttle = (keys['KeyW'] || keys['ArrowUp']) ? 1 : 0;
    const brake = (keys['KeyS'] || keys['ArrowDown']) ? 1 : 0;
    const left = (keys['KeyA'] || keys['ArrowLeft']) ? 1 : 0;
    const right = (keys['KeyD'] || keys['ArrowRight']) ? 1 : 0;
    const handbrake = keys['Space'] ? 1 : 0;

    // Ускорение
    if (throttle) state.speed += state.accel * dt;
    if (brake) state.speed -= state.brakeForce * dt;

    // Трение
    state.speed *= state.friction;

    // Ограничение
    state.speed = Math.max(-state.maxSpeed / 3, Math.min(state.maxSpeed, state.speed));

    // Поворот (зависит от скорости)
    const turnFactor = Math.min(1, Math.abs(state.speed) / 20);
    const direction = state.speed >= 0 ? 1 : -1;
    const turn = (right - left) * state.turnSpeed * turnFactor * direction;

    // Занос (ручник)
    if (handbrake) {
        state.drift += 0.1;
        state.angle += turn * 1.5 * dt;
        state.speed *= 0.94;
    } else {
        state.drift *= 0.9;
        state.angle += turn * dt;
    }

    // Движение
    const dx = Math.sin(state.angle) * state.speed * dt;
    const dz = Math.cos(state.angle) * state.speed * dt;

    const newX = state.x + dx;
    const newZ = state.z + dz;

    // Коллизии с трассой
    const dist = distToTrack(newX, newZ);
    if (dist < TRACK_WIDTH + 30) {
        state.x = newX;
        state.z = newZ;
    } else {
        state.speed *= 0.5;
    }

    // Вращение колёс
    wheels.forEach(w => {
        w.rotation.x += state.speed * dt * 2;
    });

    // Кручение колёс (передние)
    wheels[0].rotation.y = left * 0.3;
    wheels[1].rotation.y = right * 0.3;

    // Смена подсветки при ручнике
    underGlow.material.opacity = handbrake ? 1 : 0.6;

    // Мигание задних фонарей при торможении
    const tailIntensity = brake ? 1 : 0.3;
    taillightMat.color.setHex(brake ? 0xFF0000 : 0xFF0055);

    // Круг
    const now = performance.now();
    const lapTime = (now - state.lapStart) / 1000;
    timerEl.textContent = lapTime.toFixed(2);

    // Проверка круга (проехать определённое расстояние)
    const angleToStart = Math.atan2(-state.z, -state.x);
    if (Math.abs(angleToStart) < 0.3 && state.speed > 5 && state.lastCheckpoint === 0) {
        if (state.lap > 0) {
            const finalLap = (now - state.lapStart) / 1000;
            if (!state.bestLap || finalLap < state.bestLap) {
                state.bestLap = finalLap;
                bestEl.textContent = finalLap.toFixed(2);
            }
        }
        state.lap++;
        lapEl.textContent = state.lap;
        state.lapStart = now;
        state.lastCheckpoint = 1;
    } else if (Math.abs(angleToStart) > 1) {
        state.lastCheckpoint = 0;
    }

    // Спидометр
    speedEl.textContent = Math.abs(Math.round(state.speed * 3.6));
}

function updateCamera() {
    const camOffset = new THREE.Vector3(0, 4, 10);
    const camTarget = new THREE.Vector3(0, 1, 0);

    if (cameraMode === 0) {
        // Сзади
        camOffset.set(0, 4, 10);
        camTarget.set(0, 1, 0);
    } else if (cameraMode === 1) {
        // Капот
        camOffset.set(0, 1.5, 0.5);
        camTarget.set(0, 1.2, -10);
    } else {
        // Сверху
        camOffset.set(0, 15, 5);
        camTarget.set(0, 0, 0);
    }

    // Вращение offset по углу машины
    const rotatedOffset = camOffset.clone();
    rotatedOffset.applyAxisAngle(new THREE.Vector3(0, 1, 0), state.angle);

    const desiredPos = new THREE.Vector3(state.x, 0, state.z).add(rotatedOffset);

    // Плавное следование
    camera.position.lerp(desiredPos, 0.15);

    // Куда смотрит
    const rotatedTarget = camTarget.clone();
    rotatedTarget.applyAxisAngle(new THREE.Vector3(0, 1, 0), state.angle);
    const lookAt = new THREE.Vector3(state.x, 0, state.z).add(rotatedTarget);
    camera.lookAt(lookAt);
}

function updateCar() {
    car.position.set(state.x, 0, state.z);
    car.rotation.y = state.angle;

    // Наклон при повороте
    const turn = (keys['KeyD'] || keys['ArrowRight'] ? 1 : 0) - (keys['KeyA'] || keys['ArrowLeft'] ? 1 : 0);
    car.rotation.z = -turn * 0.05 * Math.min(1, Math.abs(state.speed) / 30);
}

let lastTime = performance.now();

function animate() {
    requestAnimationFrame(animate);

    const now = performance.now();
    const dt = Math.min((now - lastTime) / 1000, 0.1);
    lastTime = now;

    update(dt);
    updateCar();
    updateCamera();

    // Вращение cyan света вокруг машины
    cyanLight.position.x = state.x;
    cyanLight.position.z = state.z;

    // Фон неба (градиент)
    const skyColor = new THREE.Color().setHSL(0.75 + Math.sin(now * 0.0001) * 0.05, 0.8, 0.05);
    scene.background = skyColor;

    renderer.render(scene, camera);
}

// ============================================================
// RESIZE
// ============================================================
addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
});

// ============================================================
// СТАРТ
// ============================================================
resetCar();
animate();
</script>
</body>
  </html>
